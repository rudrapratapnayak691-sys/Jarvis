<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <div class="reactor"></div>

            <div>
                <h1>JARVIS</h1>
                <p>PERSONAL AI ASSISTANT</p>
            </div>

            <div class="status">
                <span></span> ONLINE
            </div>
        </header>


        <main id="chat">

            <div class="message jarvis-message">
                <div class="name">JARVIS</div>
                <div class="bubble">
                    Good day, sir. JARVIS systems are online.
                    How may I assist you?
                </div>
            </div>

        </main>


        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Ask JARVIS anything..."
                autocomplete="off"
            >

            <button id="send">
                SEND
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
